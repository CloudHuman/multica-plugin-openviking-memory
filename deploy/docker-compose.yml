# Plugin backend in a container: secrets live only in container env (agents
# running as the host user can no longer read them), restart:unless-stopped
# replaces the launchd supervisor, state persists via bind mount.
services:
  openviking-memory:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: openviking-memory-plugin:latest
    container_name: openviking-memory-plugin
    restart: unless-stopped
    env_file: .env
    environment:
      OVMEM_BIND: 0.0.0.0
      OVMEM_STATE_DIR: /app/state
    ports:
      - "8790:8790"
    volumes:
      - ../state:/app/state
      - ./certs:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
