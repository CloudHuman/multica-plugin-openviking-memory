<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <text x="20" y="34" font-size="17" font-weight="700" fill="#111827">范围模型 — 谁能看见谁的记忆</text>
  <text x="20" y="54" font-size="12" fill="#6B7280">一个工作区 = 一个 OpenViking 账号；每类记忆一个独立用户空间，key=身份，越权在存储层即被拒绝</text>

  <!-- Agents -->
  <g>
    <circle cx="88" cy="150" r="34" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
    <text x="88" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#3730A3">甲</text>
    <text x="88" y="164" text-anchor="middle" font-size="10" fill="#4B5563">oc-worker</text>
    <circle cx="88" cy="300" r="34" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <text x="88" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#9D174D">乙</text>
    <text x="88" y="314" text-anchor="middle" font-size="10" fill="#4B5563">kimi-worker</text>
    <circle cx="88" cy="392" r="22" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
    <text x="88" y="397" text-anchor="middle" font-size="11" fill="#374151">用户</text>
  </g>

  <!-- Spaces -->
  <g font-size="12.5" font-weight="700">
    <rect x="360" y="102" width="240" height="46" rx="10" fill="#FFFFFF" stroke="#0D9488"/>
    <text x="480" y="122" text-anchor="middle" fill="#111827">任务协作空间</text>
    <text x="480" y="139" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6B7280">task:{ws}:{issue} — 同一任务的运行与评论</text>

    <rect x="360" y="166" width="240" height="46" rx="10" fill="#FFFFFF" stroke="#6366F1"/>
    <text x="480" y="186" text-anchor="middle" fill="#111827">甲的公共记忆</text>
    <text x="480" y="203" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6B7280">agent:{ws}:{甲} — 跨任务沉淀</text>

    <rect x="360" y="230" width="240" height="46" rx="10" fill="#FFFFFF" stroke="#DB2777"/>
    <text x="480" y="250" text-anchor="middle" fill="#111827">乙的公共记忆</text>
    <text x="480" y="267" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6B7280">agent:{ws}:{乙}</text>

    <rect x="360" y="294" width="240" height="46" rx="10" fill="#FFFFFF" stroke="#F59E0B"/>
    <text x="480" y="314" text-anchor="middle" fill="#111827">工作区共享空间</text>
    <text x="480" y="331" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6B7280">shared:{ws} — 夜间晋升可复用知识</text>

    <rect x="360" y="364" width="240" height="46" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-dasharray="5 3"/>
    <text x="480" y="384" text-anchor="middle" fill="#111827">私聊配对空间（甲 ↔ 用户）</text>
    <text x="480" y="401" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6B7280">dm:{ws}:{甲}:{用户} — 私聊运行 / 配套事件</text>
  </g>

  <!-- Access arrows from 甲 -->
  <g stroke-width="1.8" fill="none">
    <line x1="122" y1="140" x2="360" y2="122" stroke="#059669" marker-end="url(#ok)"/>
    <line x1="122" y1="152" x2="360" y2="180" stroke="#059669" marker-end="url(#ok)"/>
    <line x1="122" y1="168" x2="360" y2="312" stroke="#059669" marker-end="url(#ok)"/>
    <line x1="122" y1="176" x2="360" y2="382" stroke="#7C3AED" stroke-dasharray="5 3" marker-end="url(#ok)"/>
    <line x1="122" y1="128" x2="360" y2="248" stroke="#DC2626" stroke-dasharray="5 3" marker-end="url(#no)"/>
  </g>
  <!-- Access arrows from 乙 -->
  <g stroke-width="1.8" fill="none">
    <line x1="122" y1="290" x2="360" y2="140" stroke="#059669" marker-end="url(#ok)"/>
    <line x1="122" y1="300" x2="360" y2="252" stroke="#059669" marker-end="url(#ok)"/>
    <line x1="122" y1="312" x2="360" y2="320" stroke="#059669" marker-end="url(#ok)"/>
    <line x1="122" y1="324" x2="360" y2="192" stroke="#DC2626" stroke-dasharray="5 3" marker-end="url(#no)"/>
  </g>
  <!-- user to dm -->
  <line x1="110" y1="382" x2="360" y2="392" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#ok)"/>

  <g font-size="10.5">
    <text x="236" y="112" fill="#059669">✓ 本任务可读写</text>
    <text x="234" y="160" fill="#059669">✓ 自己的公共记忆</text>
    <text x="236" y="196" fill="#DC2626">✗ 403</text>
    <text x="230" y="330" fill="#059669">✓ 共享（读）</text>
    <text x="230" y="376" fill="#7C3AED">✓ 配对私聊</text>
    <text x="234" y="246" fill="#DC2626">✗ 403</text>
  </g>

  <!-- Right legend -->
  <rect x="650" y="102" width="290" height="150" rx="12" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="668" y="128" font-size="12.5" font-weight="700" fill="#111827">召回 = 多空间合并</text>
  <text x="668" y="148" font-size="11" fill="#4B5563">· 每空间用各自的 key 检索，插件合并排序</text>
  <text x="668" y="166" font-size="11" fill="#4B5563">· top-5，附 uri + scope 来源可回查</text>
  <text x="668" y="184" font-size="11" fill="#4B5563">· stub 过滤 / 去重 / 范围优先级</text>
  <text x="668" y="208" font-size="11" fill="#4B5563">· 无记忆时如实返回空，不编造</text>
  <rect x="650" y="268" width="290" height="142" rx="12" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="668" y="294" font-size="12.5" font-weight="700" fill="#111827">归档去向由场景决定</text>
  <text x="668" y="314" font-size="11" fill="#4B5563">· 任务运行/评论 → 任务协作空间</text>
  <text x="668" y="332" font-size="11" fill="#4B5563">· memory-remember / ov-* → 本智能体公共</text>
  <text x="668" y="350" font-size="11" fill="#4B5563">· 私聊 → 配对空间 · 委派 → 通道空间</text>
  <text x="668" y="374" font-size="11" fill="#4B5563">· 每次 run 独立会话，作者/归属随档保留</text>
  <text x="668" y="394" font-size="11" fill="#4B5563">· 幂等：重复投递 / 重放不产生重复归档</text>
</svg>
